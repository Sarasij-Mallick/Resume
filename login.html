<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register - ResumeBuilder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #f7fbff, #e2e8f0);
    }
    .auth-container {
      width: 100%;
      max-width: 400px;
      padding: 32px;
      position: relative;
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 44px rgba(8, 15, 33, 0.08);
      border: 1px solid rgba(11, 18, 32, 0.04);
      animation: fadeUp 0.5s ease;
    }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      font-size: 24px;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
    }
    .close-btn:hover {
      color: var(--text);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-header svg {
      margin-bottom: 12px;
    }
    .auth-header h2 {
      font-size: 24px;
      margin: 0;
      color: var(--text);
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-form input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(15, 23, 42, 0.06);
      background: #f8f9fa;
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-form input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.12);
    }
    .auth-form button {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      font-size: 16px;
    }
    .switch {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }
    .switch a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .switch a:hover {
      text-decoration: underline;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="auth-container" id="login">
    <button class="close-btn" onclick="goHome()" aria-label="Close">×</button>
    <div class="auth-header">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <defs>
              <linearGradient id="grad1" x1="0" x2="1">
                  <stop offset="0" stop-color="#4285F4" />
                  <stop offset="1" stop-color="#34A853" />
              </linearGradient>
          </defs>
          <rect x="1" y="1" width="22" height="22" rx="6" fill="url(#grad1)" />
          <path d="M7 13c2-3 6-5 10-5" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h2>Welcome Back</h2>
    </div>
    <form class="auth-form" onsubmit="event.preventDefault(); goHome();">
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <div class="switch">
      Don't have an account? <a href="#" onclick="showRegister()">Register</a>
    </div>
  </div>

  <div class="auth-container" id="register" style="display:none;">
    <button class="close-btn" onclick="goHome()" aria-label="Close">×</button>
    <div class="auth-header">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <defs>
              <linearGradient id="grad2" x1="0" x2="1">
                  <stop offset="0" stop-color="#4285F4" />
                  <stop offset="1" stop-color="#34A853" />
              </linearGradient>
          </defs>
          <rect x="1" y="1" width="22" height="22" rx="6" fill="url(#grad2)" />
          <path d="M7 13c2-3 6-5 10-5" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h2>Create Account</h2>
    </div>
    <form class="auth-form" onsubmit="event.preventDefault(); goHome();">
      <input type="text" placeholder="Username" required>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <div class="switch">
      Already have an account? <a href="#" onclick="showLogin()">Login</a>
    </div>
  </div>

  <script>
    function showRegister() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('register').style.display = 'block';
    }
    function showLogin() {
      document.getElementById('register').style.display = 'none';
      document.getElementById('login').style.display = 'block';
    }
    function goHome() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
